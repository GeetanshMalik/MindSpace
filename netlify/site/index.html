<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mindspace Backend</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10130f;
        color: #edf4eb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 6vw, 54px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #b9cbbd;
        font-size: 16px;
        line-height: 1.6;
      }

      code {
        display: block;
        margin-top: 24px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #1b2019;
        color: #c7ead4;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mindspace backend</h1>
      <p>This Netlify site hosts the API functions used by the mobile app for push token registration and notification delivery.</p>
      <code>/.netlify/functions/send-notification</code>
    </main>
  </body>
</html>
